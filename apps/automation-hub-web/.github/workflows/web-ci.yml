name: Automation Hub Web Checks
on:
  pull_request:
    paths:
      - 'apps/automation-hub-web/**'
      - '.github/workflows/automation-hub-web.yml'
  workflow_dispatch:
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/automation-hub-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/automation-hub-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
